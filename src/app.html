<!doctype html>
<html lang="id" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Quran Search — Telusuri Ayat, Terjemahan & Asbabun Nuzul</title>
		<meta name="description" content="Aplikasi Quran modern dengan pencarian cerdas, terjemahan Indonesia, audio murattal, dan latar belakang asbabun nuzul." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet" />
		<script>
			// Inisialisasi tema sebelum render untuk mencegah flickering
			(function() {
				try {
					var stored = localStorage.getItem('quran_theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (stored === 'dark' || (!stored && prefersDark)) {
						document.documentElement.classList.add('dark');
						document.documentElement.classList.remove('light');
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.classList.add('light');
					}
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 font-sans selection:bg-emerald-500 selection:text-white antialiased transition-colors duration-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
